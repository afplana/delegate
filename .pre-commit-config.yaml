# Runs the same checks as CI before each commit: the full golangci-lint run
# and a gitleaks scan of the staged diff.
repos:
-   repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
    -   id: golangci-lint-full
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -   id: gitleaks-system
        # Upstream omits this for the -system variant; gitleaks scans the
        # staged diff itself and treats extra filename args as a git dir.
        pass_filenames: false
